[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "support-agent-doctor"
version = "1.0.0"
description = "Audit a support ticket CSV export for agent performance: slow first replies, slow resolutions, reopens, escalations, and CSAT"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.scripts]
support-agent-doctor = "support_agent_doctor:main_entry"

[tool.setuptools]
py-modules = ["support_agent_doctor"]
